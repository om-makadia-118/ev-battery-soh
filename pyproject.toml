[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ev-battery-soh"
version = "0.3.0"
description = "Cross-dataset generalization of EV battery state-of-health estimators"
requires-python = ">=3.10"
dependencies = [
 "numpy>=1.24,<3", "pandas>=2.0,<3", "scipy>=1.11", "scikit-learn>=1.3",
 "xgboost>=2.0", "matplotlib>=3.7", "h5py>=3.9", "openpyxl>=3.1"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
deep = ["torch>=2.2"]
parquet = ["pyarrow>=14"]

[project.scripts]
battery-soh = "battery_soh.cli:main"

[tool.setuptools.packages.find]
include = ["battery_soh*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
