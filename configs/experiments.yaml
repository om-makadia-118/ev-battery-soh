# Strictly shared predictors. Extend ONLY after verifying actual columns in all 5 datasets.
features: [cycle]
eol_threshold: 80.0
truncate_at_eol: false
sequence_window: 4
seeds: [11, 22, 33, 44, 55]
models: [mean, ridge, elasticnet, xgboost, lstm, cnn, transformer]
deep:
  epochs: 30
  patience: 5
  batch_size: 64
  learning_rate: 0.001
  hidden_dim: 64
